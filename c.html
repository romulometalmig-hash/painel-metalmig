<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>Catálogo Metalmig</title>
<style>
:root{--nv:#1b2a4a;--ac:#e4572e;--bg:#f6f7fa;--ln:#e1e5ee;--mu:#6b7688;--gr:#1fa855}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--nv);padding-bottom:140px;max-width:640px;margin:0 auto}
.top{background:var(--nv);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}.top img{height:30px;background:#fff;border-radius:6px;padding:2px}.top b{font-size:16px;display:block}.top small{opacity:.75;font-size:12px}
.wrap{padding:12px}h2{font-size:21px;margin-bottom:6px}p{font-size:14px;line-height:1.4;color:#44506a}
.card{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:10px}
.btn{display:block;width:100%;text-align:center;border:0;border-radius:12px;padding:15px;font-weight:700;font-size:16px;background:var(--ac);color:#fff;margin-bottom:8px;cursor:pointer}.btn.g{background:var(--gr)}.btn.l{background:#fff;color:var(--nv);border:2px solid #cfd6e3}.btn.s{padding:10px;font-size:14px}
.row2{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:6px 0;border-bottom:1px dashed var(--ln)}.row2:last-child{border:0}.row2 span:first-child{color:var(--mu)}.row2 b{text-align:right}
input,textarea{width:100%;font:inherit;font-size:15px;border:2px solid #cfd6e3;border-radius:10px;padding:11px;margin:4px 0 8px;background:#fff;color:var(--nv)}
.pr{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--ln);border-radius:12px;padding:10px;margin-bottom:7px}.pr.s{border-color:var(--ac);background:#fff8f4}
.pr .n{flex:1;min-width:0;font-size:14px;font-weight:600;line-height:1.25}.pr .n small{display:block;font-weight:400;color:var(--mu);font-size:11.5px;margin-top:2px}
.pv{font-weight:700;font-size:14px;text-align:right;white-space:nowrap}.pv small{display:block;font-weight:400;font-size:10.5px;color:#b4451f}
.q{display:flex;align-items:center;gap:6px;justify-content:flex-end;margin-top:5px}.q b{width:32px;height:32px;border-radius:9px;background:var(--nv);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;user-select:none}.q u{text-decoration:none;min-width:24px;text-align:center;font-weight:700}
.add{background:var(--ac);color:#fff;border-radius:9px;padding:8px 12px;font-size:13px;font-weight:700;margin-top:5px;display:inline-block;cursor:pointer;text-align:center}
.fam{font-weight:800;font-size:15px;margin:12px 2px 6px}
.nav{position:fixed;bottom:0;left:0;right:0;max-width:640px;margin:0 auto;display:flex;background:#fff;border-top:1px solid #d9dee8;padding-bottom:env(safe-area-inset-bottom,0)}.nav div{flex:1;text-align:center;padding:9px 0 11px;font-size:12px;color:var(--mu);cursor:pointer}.nav div.on{color:var(--ac);font-weight:700}.nav i{display:block;font-style:normal;font-size:21px}
.bar{position:fixed;left:12px;right:12px;bottom:calc(64px + env(safe-area-inset-bottom,0));max-width:616px;margin:0 auto;background:var(--gr);color:#fff;border-radius:12px;padding:13px 14px;display:flex;justify-content:space-between;font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}.chip{flex:none;background:#fff;border:1px solid #cfd6e3;border-radius:20px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer}.chip.on{background:var(--nv);color:#fff}
.pgn{display:flex;gap:8px;align-items:center;margin-bottom:8px}.pgn .btn{margin:0;width:auto;padding:10px 16px;font-size:15px}.pgn span{flex:1;text-align:center;font-weight:700;font-size:14px}
.pg{background:#fff;border:1px solid #d9dee8;border-radius:10px;overflow-x:auto;margin-bottom:10px}.pg img{width:100%;display:block}.pg.z img{width:230%;max-width:none}
.tot{background:var(--nv);color:#fff;border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;font-size:16px;font-weight:700;margin:8px 0 10px}
.sug{border-color:#f1c8b6;background:#fff8f4}.tag{display:inline-block;background:#fff3e8;color:#b4451f;border-radius:6px;padding:2px 7px;font-size:11.5px;font-weight:700}
.obs{background:#fffbe6;border:1px solid #f0dc8a;border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.4;margin-bottom:10px}.obs b{display:block;font-size:12px;color:#8a6d00;margin-bottom:3px}
.ok{background:#e7f6ec;color:#17803f;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700}.hint{font-size:12px;color:var(--mu);text-align:center;margin:6px 0}

${removed.length?`<p class=hint>Você tirou ${removed.length} ${removed.length>1?'itens sugeridos':'item sugerido'}.</p>`:''}
${items.length?`${PRICE?`<div class=tot><span>Total (tabela + IPI)</span><span>${br(t.t)}</span></div>${chkMin()?(t.t>=MIN?`<div class=ok style="display:block;text-align:center;padding:8px;margin-bottom:8px">✔ Pedido mínimo de ${br(MIN)} atingido</div>`:`<div class=card style="background:#fff8f4;border-color:#f1c8b6;padding:10px;margin-bottom:8px"><b style="font-size:14px">Pedido mínimo: ${br(MIN)}</b><p style="font-size:13px;margin-top:2px">Faltam <b>${br(MIN-t.t)}</b>. Você pode acrescentar mais itens ou enviar assim mesmo.</p></div>`):''}<p class=hint>Valores de tabela, sem frete. Condições com seu vendedor.</p>`:''}<label style="font-size:13px;font-weight:700">📝 Observação (opcional)</label><textarea id=obs rows=2 placeholder="Ex.: entregar na segunda">${esc(obsC)}</textarea><div class="btn g" data-a="send">📲 Enviar pedido pelo WhatsApp</div>`:''}</div>`}
let minS=[];function vMin(){const t=total();const s=minS;return`<div class=wrap><div class="card sug"><b style="font-size:16px">Quase lá! 🙂</b><p style="margin-top:4px">Para enviar pelo catálogo, o pedido precisa ser um pouco maior. Que tal acrescentar o que você costuma levar?</p></div>${s.length?s.map(([c,d])=>rowH(c,null,`</small><small><span class=tag>Última compra: ${ago(d)}</span>`)).join(''):''}
${PRICE?`<div class=tot><span>Total (tabela + IPI)</span><span>${br(t.t)}</span></div>`:''}${t.t>=MIN?'<div class="btn g" data-a="send2">📲 Enviar pedido pelo WhatsApp</div>':'<div class="btn g" data-a="force">📲 Enviar assim mesmo</div>'}<div class="btn l" data-a="v" data-v="cat">＋ Escolher mais no catálogo</div></div>`}
function msg(force){const t=total();const o=[];o.push(`*PEDIDO – ${cli.n.toUpperCase()}*`);o.push([cli.cd,cli.t].filter(Boolean).join(' · '));o.push(corr?'✏️ Dados corrigidos pelo cliente':(L.n?'✔ Dados conferidos':''));if(L.r)o.push('Rep.: '+L.r);o.push('');
Object.keys(cart).filter(c=>cart[c]).forEach(c=>{const p=P(c),q=cart[c],u=unit(c);let l=`${q} × ${p[0]} (cód. ${c})`;if(PRICE)l+=u!=null?` — ${br(lin(c,q))}`:' — sob consulta';if(base[c]!=null&&base[c]!==q)l+=` ✏️ (sugerido ${base[c]})`;else if(Object.keys(base).length&&base[c]==null)l+=' ➕ (incluído pelo cliente)';o.push(l)});
Object.keys(base).filter(c=>!cart[c]).forEach(c=>o.push(`❌ Removido: ${base[c]} × ${P(c)[0]} (cód. ${c})`));
o.push('');if(L.o&&Object.keys(base).length)o.push('📝 Recado do rep.: '+L.o);if(obsC.trim())o.push('💬 Obs. do cliente: '+obsC.trim());

let sent='';function doSend(force){sent=msg(force);view='done';draw();window.scrollTo(0,0);location.href='https://wa.me/'+PH+'?text='+encodeURIComponent(sent)}

let fixing=false;

else if(a==='v'){if(view==='pedido'){const o=$('#obs');if(o)obsC=o.value}view=t.dataset.v;draw();window.scrollTo(0,0)}

else if(a==='pg'){pg=Math.min(18,Math.max(1,pg+ +t.dataset.d));zoom=false;draw();window.scrollTo(0,0)}
else if(a==='sec'){pg=+t.dataset.p;zoom=false;draw();window.scrollTo(0,0)}
else if(a==='secb'){sec=+t.dataset.i;draw()}else if(a==='zoom'){zoom=!zoom;draw()}
else if(a==='send'){const o=$('#obs');if(o)obsC=o.value;const tt=total();if(!tt.n)return;if(PRICE&&L.n&&!L.nv&&tt.t<MIN){minS=sugs().slice(0,5);view='min';draw();window.scrollTo(0,0)}else doSend(false)}
else if(a==='send2')doSend(false);else if(a==='force')doSend(true);
else if(a==='copy'){try{navigator.clipboard.writeText(sent);t.textContent='✔ Copiado'}catch(x){}}});
document.addEventListener('input',e=>{if(e.target.id==='sq'){sq=e.target.value;const r=buscaList();$('#res').innerHTML=r.length?r.map(c=>rowH(c)).join(''):'<p class=hint>Nada encontrado. Tente outra palavra.</p>'}});
draw();
