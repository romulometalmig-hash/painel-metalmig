<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>Catálogo Metalmig</title>
<style>
:root{--nv:#14233f;--ac:#d9480f;--bg:#f4f6fa;--ln:#d5dbe6;--mu:#4a566b;--gr:#17803f}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{font-size:18px}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--nv);padding-bottom:150px;max-width:680px;margin:0 auto;line-height:1.35}
.top{background:var(--nv);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}.top img{height:36px;background:#fff;border-radius:7px;padding:2px}.top b{font-size:1.05rem;display:block}.top small{opacity:.85;font-size:.8rem}
.wrap{padding:14px}h2{font-size:1.45rem;margin-bottom:8px}p{font-size:1rem;color:#33405a}
.card{background:#fff;border:1px solid var(--ln);border-radius:16px;padding:16px;margin-bottom:12px}
.btn{display:block;width:100%;text-align:center;border:0;border-radius:14px;padding:17px;font-weight:800;font-size:1.1rem;background:var(--ac);color:#fff;margin-bottom:10px;cursor:pointer;min-height:58px}.btn.g{background:var(--gr)}.btn.l{background:#fff;color:var(--nv);border:2px solid #aab4c6}
.row2{display:flex;justify-content:space-between;gap:10px;font-size:1rem;padding:8px 0;border-bottom:1px dashed var(--ln)}.row2:last-child{border:0}.row2 span:first-child{color:var(--mu)}.row2 b{text-align:right}
input,textarea{width:100%;font:inherit;font-size:1.05rem;border:2px solid #9aa6bb;border-radius:12px;padding:14px;margin:4px 0 10px;background:#fff;color:var(--nv)}
label{font-weight:700;font-size:1rem}
.lines{display:grid;grid-template-columns:1fr 1fr;gap:12px}.ln{background:#fff;border:2px solid var(--ln);border-radius:18px;padding:10px;text-align:center;font-weight:800;font-size:1.02rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:space-between}.ln img{width:100%;height:110px;object-fit:contain}
.pc{background:#fff;border:1.5px solid var(--ln);border-radius:16px;padding:12px;margin-bottom:12px}.pc.s{border-color:var(--ac);background:#fff8f3}
.pc .h{display:flex;gap:12px;align-items:center}.pc .h img{width:84px;height:84px;object-fit:contain;flex:none;background:#fff;border-radius:10px}.pc .t{font-weight:800;font-size:1.08rem;line-height:1.25}.pc .t small{display:block;font-weight:400;color:var(--mu);font-size:.85rem;margin-top:3px}
.vr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--ln);margin-top:10px}.vr .l{flex:1;min-width:0;font-weight:700;font-size:1.02rem}.vr .l small{display:block;font-weight:400;color:var(--mu);font-size:.82rem}
.pv{font-weight:800;font-size:1.1rem;white-space:nowrap}.pv small{display:block;font-weight:600;font-size:.78rem;color:#9a3412}
.q{display:flex;align-items:center;gap:8px}.q b{width:50px;height:50px;border-radius:12px;background:var(--nv);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.6rem;cursor:pointer;user-select:none}.q u{text-decoration:none;min-width:30px;text-align:center;font-weight:800;font-size:1.3rem}
.add{background:var(--ac);color:#fff;border-radius:12px;padding:14px 16px;font-size:1rem;font-weight:800;display:inline-block;cursor:pointer;text-align:center;min-height:50px;min-width:130px}
.nav{position:fixed;bottom:0;left:0;right:0;max-width:680px;margin:0 auto;display:flex;background:#fff;border-top:2px solid #c3cbd9;padding-bottom:env(safe-area-inset-bottom,0)}.nav div{flex:1;text-align:center;padding:9px 0 11px;font-size:.92rem;font-weight:700;color:var(--mu);cursor:pointer}.nav div.on{color:var(--ac)}.nav i{display:block;font-style:normal;font-size:1.7rem}
.bar{white-space:nowrap;position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0));max-width:656px;margin:0 auto;background:var(--gr);color:#fff;border-radius:14px;padding:16px;display:flex;justify-content:space-between;font-weight:800;font-size:1.1rem;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.back{display:inline-block;font-weight:800;font-size:1.05rem;color:var(--nv);background:#fff;border:2px solid #aab4c6;border-radius:12px;padding:12px 16px;margin-bottom:12px;cursor:pointer}
.tot{background:var(--nv);color:#fff;border-radius:14px;padding:16px;display:flex;justify-content:space-between;font-size:1.2rem;font-weight:800;margin:10px 0 12px}
.sug{border-color:#f0b99a;background:#fff8f3}.tag{display:inline-block;background:#ffe8d6;color:#9a3412;border-radius:8px;padding:3px 8px;font-size:.8rem;font-weight:700}
.obs{background:#fff7d1;border:1px solid #e8cf62;border-radius:14px;padding:14px;font-size:1rem;margin-bottom:12px}.obs b{display:block;font-size:.88rem;color:#7a5c00;margin-bottom:4px}
.ok{background:#e1f5e8;color:#136b34;border-radius:10px;padding:10px;font-weight:700;text-align:center;margin-bottom:10px}.hint{font-size:.88rem;color:var(--mu);text-align:center;margin:8px 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:10px}.chip{flex:none;background:#fff;border:2px solid #aab4c6;border-radius:24px;padding:10px 16px;font-size:.95rem;font-weight:700;cursor:pointer}.chip.on{background:var(--nv);color:#fff;border-color:var(--nv)}
.pgimg{width:100%;display:block;border-radius:10px;border:1px solid var(--ln);margin-bottom:10px}

 while(i<bo.length||j<no.length){if(i<bo.length){tag.set(bo[i].f,'b');out.push(bo[i++])}if(j<no.length){if(nt<4){tag.set(no[j].f,'n');nt++}out.push(no[j++])}}
 return{items:out.flatMap(x=>x.v),tag}}
let view='hello',ln=-1,pg=1,sq='',obsC='',minS=[],sent='',scrollY=0;
const $=s=>document.querySelector(s);
const br=v=>'R$ '+v.toFixed(2).replace('.',',').replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nz=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/galvanizad[ao]s?/g,'galv').replace(/\bcaixas?\b/g,'cx').replace(/\bcorreios?\b/g,'cor').replace(/\bnumeros?\b/g,'n').replace(/\bn[º°o]\b/g,'n').replace(/\b(de|do|da|com|para)\b/g,' ').replace(/[.,]/g,' ').replace(/\s+/g,' ');
const P=c=>D.prods[c],lin=(c,k)=>Math.round(P(c)[1]*(1+(P(c)[2]||0))*k*100)/100,unit=c=>P(c)[1]==null?null:Math.round(P(c)[1]*(1+(P(c)[2]||0))*100)/100;
function total(){let t=0,n=0;for(const c in cart){const k=cart[c];if(!k)continue;n++;if(P(c)[1]!=null)t+=lin(c,k)}return{t:Math.round(t*100)/100,n}}
const skey=()=>'mmc2_'+(L.n||'x')+'_'+location.hash.length;
function save(){try{localStorage.setItem(skey(),JSON.stringify(cart))}catch(e){}}
try{const s=JSON.parse(localStorage.getItem(skey())||'null');if(s&&!(L.it||[]).length)cart=s}catch(e){}
function setQ(c,d){const v=Math.max(0,(cart[c]||0)+d);if(v)cart[c]=v;else delete cart[c];save();draw(true)}
const foto=c=>{const f=P(c)[3];return f&&D.fotos[f]?D.fotos[f]:''};
function stepH(c){const q=cart[c]||0;return q?`<div class=q><b data-a="s" data-c="${c}">−</b><u>${q}</u><b data-a="a" data-c="${c}">+</b></div>`:`<div class=add data-a="a" data-c="${c}">+ Adicionar</div>`}
function priceH(c){const p=P(c);if(!PRICE)return'';return p[1]!=null?`<div class=pv>${br(p[1])}${p[2]?`<small>+ IPI ${Math.round(p[2]*1000)/10}%</small>`:''}</div>`:'<div class=pv style="font-size:.9rem;font-weight:700;color:#4a566b">preço sob consulta</div>'}
function cardH(c,sub){const p=P(c),q=cart[c]||0,im=foto(c);return`<div class="pc ${q?'s':''}"><div class=h>${im?`<img src="${im}" alt="">`:''}<div class=t>${esc(p[0])}<small>Cód. ${c}${sub||''}</small></div></div><div class=vr style="margin-top:10px">${priceH(c)||'<span></span>'}${stepH(c)}</div></div>`}
function famCards(items0){const fo=famOrder(items0),items=fo.items,TG=fo.tag;const tg=f=>TG.get(f)==='b'?'<span class=tag style="background:#e1f5e8;color:#136b34">Você já compra</span>':TG.get(f)==='n'?'<span class=tag>Novidade para você</span>':'';const fs=new Map();items.forEach(([c,f,l])=>{if(!fs.has(f))fs.set(f,[]);fs.get(f).push([c,l])});let h='';
 fs.forEach((v,f)=>{if(v.length===1){h+=cardH(v[0][0],tg(f)?'<br>'+tg(f):'')}else{const q=v.some(([c])=>cart[c]);const im=(()=>{for(const [c] of v){const x=foto(c);if(x)return x}return''})();
  h+=`<div class="pc ${q?'s':''}"><div class=h>${im?`<img src="${im}" alt="">`:''}<div class=t>${esc(f)}<small>${v.length} medidas ${tg(f)}</small></div></div>${v.map(([c,l])=>`<div class=vr><div class=l>${esc(l||P(c)[0])}<small>Cód. ${c}</small></div>${PRICE?priceH(c):''}${stepH(c)}</div>`).join('')}</div>`}});return h}
function bar(){const t=total();if(!t.n||['pedido','hello','min','done'].includes(view)){$('#bar').innerHTML='';return}$('#bar').innerHTML=`<div class=bar data-a="v" data-v="pedido"><span>🛒 Meu pedido · ${t.n}</span><span>${PRICE&&t.t?br(t.t):''}</span></div>`}
function nav(){const n=$('#nav');n.hidden=['hello','done'].includes(view);const cur=view==='line'||view==='pages'?'home':view==='min'?'pedido':view;n.innerHTML=[['home','🏠','Início'],['busca','🔍','Buscar'],['pedido','🛒','Meu pedido']].map(([v,i,t])=>`<div class="${cur===v?'on':''}" data-a="v" data-v="${v}"><i>${i}</i>${t}</div>`).join('')}
const obsH=()=>L.o&&Object.keys(base).length?`<div class=obs><b>📝 Recado${L.r?' de '+esc(L.r):''}</b>${esc(L.o)}</div>`:'';
function vHello(){const f=cli;if(fixing||!L.n)return`<div class=wrap><h2>${L.n?'Corrigir dados':'Olá! 👋'}</h2><p>${L.n?'Altere o que estiver errado:':'Informe seus dados para fazer o pedido:'}</p><div style="margin-top:10px"><label>Empresa / razão social</label><input id=fn value="${esc(f.n)}"><label>Cidade / UF</label><input id=fc value="${esc(f.cd)}"><label>Telefone</label><input id=ft inputmode=tel value="${esc(f.t)}"><div class=btn data-a="save">Continuar</div></div></div>`;
return`<div class=wrap><h2>Olá! 👋</h2><p>Vamos conferir seus dados?</p><div class=card style="margin-top:12px"><div class=row2><span>Empresa</span><b>${esc(f.n)}</b></div><div class=row2><span>Cidade</span><b>${esc(f.cd)}</b></div><div class=row2><span>Telefone</span><b>${esc(f.t)}</b></div></div>${L.r?`<p style="margin-bottom:12px">Seu atendimento: <b>${esc(L.r)}</b></p>`:''}<div class=btn data-a="ok">✔ Está tudo certo</div><div class="btn l" data-a="fix">✏️ Corrigir algum dado</div><p class=hint>Não precisa de cadastro nem de senha.</p></div>`}
function vHome(){return`<div class=wrap>${obsH()}<input id=hq placeholder="🔍 Digite o nome ou o código do produto" autocomplete=off><h2>Escolha o tipo de produto</h2><div class=lines>${ORD.map(i=>{const l=D.lines[i];return`<div class=ln data-a="line" data-i="${i}"><img src="${D.fotos[l.f]||''}" alt="">${esc(l.n)}</div>`}).join('')}</div><div class="btn l" style="margin-top:16px" data-a="pages">📖 Ver o catálogo em páginas</div></div>`}
function vLine(){const l=D.lines[ln];return`<div class=wrap>${obsH()}<div class=back data-a="v" data-v="home">‹ Voltar</div><h2>${esc(l.n)}</h2><input id=lq placeholder="🔍 Procurar nesta lista" autocomplete=off value="${esc(sq)}"><div id=lres>${lineList()}</div><div class="btn l" data-a="pages" data-p="${l.pg}">📖 Ver estas páginas no catálogo</div></div>`}
function lineList(){const l=D.lines[ln];const q=nz(sq).trim();let it=l.items;if(q.length>=2){const ps=q.split(' ');it=it.filter(([c,f,lab])=>{const s=nz(P(c)[0]+' '+f+' '+c);return ps.every(w=>s.includes(w))})}return it.length?famCards(it):'<p class=hint>Nada encontrado. Tente outra palavra.</p>'}
function searchRes(q){q=nz(q).trim();if(q.length<2)return'<p class=hint>Digite pelo menos 2 letras ou o código.</p>';const ps=q.split(' ');const r=[];for(const c in D.prods){const p=D.prods[c];if(p[1]==null&&!D.pgfirst[c])continue;const s=nz(p[0]+' '+c);if(String(c).startsWith(q)||ps.every(w=>s.includes(w)))r.push(+c)}
 r.sort((a,b)=>(nz(P(a)[0]).startsWith(q)?0:1)-(nz(P(b)[0]).startsWith(q)?0:1)||P(a)[0].localeCompare(P(b)[0]));return r.length?r.slice(0,40).map(c=>cardH(c)).join(''):'<p class=hint>Nada encontrado. Tente outra palavra.</p>'}
function vBusca(){return`<div class=wrap><input id=sq placeholder="🔍 Digite o nome ou o código" autocomplete=off value="${esc(sq)}"><div id=res>${searchRes(sq)}</div></div>`}
function vPages(){const f=String(pg).padStart(2,'0');return`<div class=wrap><div class=back data-a="v" data-v="home">‹ Voltar</div><h2>Catálogo em páginas</h2><div style="display:flex;gap:10px;margin-bottom:10px"><div class="btn l" style="margin:0" data-a="pg" data-d="-1">‹ Anterior</div><div class="btn l" style="margin:0" data-a="pg" data-d="1">Próxima ›</div></div><p class=hint>Página ${pg} de 18</p><img class=pgimg src="cat/p${f}.jpg" alt="Página ${pg}"><a class="btn l" style="text-decoration:none" href="cat/p${f}.jpg" target="_blank">🔍 Abrir a página em tamanho grande</a></div>`}
const chkMin=()=>PRICE&&L.n&&!L.nv;
function ago(d){return d<45?'há '+d+' dias':d<700?'há '+Math.round(d/30)+' meses':'há mais de 1 ano'}
function sugs(){return(L.h||[]).filter(([c])=>P(c)&&!cart[c]&&P(c)[1]!=null).sort((a,b)=>a[1]-b[1])}
const sugRow=(c,d)=>cardH(c,` <span class=tag>Última compra: ${ago(d)}</span>`);
function vPedido(){const t=total();const items=Object.keys(cart).filter(c=>cart[c]);const removed=Object.keys(base).filter(c=>!cart[c]);const sg=sugs().slice(0,3);
return`<div class=wrap>${obsH()}<h2>Meu pedido</h2>${items.length?'':'<div class=card><p>Seu pedido está vazio. Toque em <b>Início</b> para escolher os produtos.</p></div>'}${sg.length&&items.length?`<div class="card sug"><b style="font-size:1.05rem">💡 Você costuma levar e ainda não pediu</b><div style="margin-top:10px">${sg.map(([c,d])=>sugRow(c,d)).join('')}</div></div>`:''}${items.map(c=>{const p=P(c),q=cart[c],alt=base[c]!=null&&base[c]!==q?` <span class=tag>✏️ você alterou · sugerido: ${base[c]}</span>`:'';return`<div class="pc s"><div class=t style="font-weight:800">${esc(p[0])}<small style="display:block;font-weight:400;color:var(--mu);font-size:.85rem">Cód. ${c}${alt}</small></div><div class=vr style="margin-top:10px">${PRICE?`<div class=pv>${p[1]!=null?`${q} × ${br(unit(c))}<small style="color:var(--nv)">= ${br(lin(c,q))}</small>`:'sob consulta'}</div>`:'<span></span>'}${stepH(c)}</div></div>`}).join('')}
${removed.length?`<p class=hint>Você tirou ${removed.length} ${removed.length>1?'itens sugeridos':'item sugerido'}.</p>`:''}
${items.length?`${PRICE?`<div class=tot><span>Total (tabela + IPI)</span><span>${br(t.t)}</span></div>${chkMin()?(t.t>=MIN?`<div class=ok>✔ Pedido mínimo de ${br(MIN)} atingido</div>`:`<div class="card sug"><b>Pedido mínimo: ${br(MIN)}</b><p style="margin-top:4px">Faltam <b>${br(MIN-t.t)}</b>. Você pode acrescentar mais itens ou enviar assim mesmo.</p></div>`):''}<p class=hint>Valores de tabela, sem frete. Condições com seu vendedor.</p>`:''}<label>📝 Observação (se quiser)</label><textarea id=obs rows=2 placeholder="Ex.: entregar na segunda">${esc(obsC)}</textarea><div class="btn g" data-a="send">📲 Enviar meu pedido pelo WhatsApp</div>`:''}</div>`}
function vMin(){const t=total();return`<div class=wrap><div class="card sug"><b style="font-size:1.2rem">Quase lá! 🙂</b><p style="margin-top:6px">O pedido mínimo é de <b>${br(MIN)}</b> e faltam <b>${br(Math.max(0,MIN-t.t))}</b>. Que tal acrescentar o que você costuma levar? Se preferir, pode enviar assim mesmo.</p></div>${minS.map(([c,d])=>sugRow(c,d)).join('')}<div class=tot><span>Total (tabela + IPI)</span><span>${br(t.t)}</span></div>${t.t>=MIN?'<div class="btn g" data-a="send2">📲 Enviar meu pedido pelo WhatsApp</div>':'<div class="btn g" data-a="force">📲 Enviar assim mesmo</div>'}<div class="btn l" data-a="v" data-v="home">＋ Escolher mais produtos</div></div>`}
function msg(force){const t=total();const o=[];o.push(`*PEDIDO – ${cli.n.toUpperCase()}*`);o.push([cli.cd,cli.t].filter(Boolean).join(' · '));o.push(corr?'✏️ Dados corrigidos pelo cliente':(L.n?'✔ Dados conferidos':''));if(L.r)o.push('Rep.: '+L.r);o.push('');
Object.keys(cart).filter(c=>cart[c]).forEach(c=>{const p=P(c),q=cart[c];let l=`${q} × ${p[0]} (cód. ${c})`;if(PRICE)l+=p[1]!=null?` — ${br(lin(c,q))}`:' — sob consulta';if(base[c]!=null&&base[c]!==q)l+=` ✏️ (sugerido ${base[c]})`;else if(Object.keys(base).length&&base[c]==null)l+=' ➕ (incluído pelo cliente)';o.push(l)});
Object.keys(base).filter(c=>!cart[c]).forEach(c=>o.push(`❌ Removido: ${base[c]} × ${P(c)[0]} (cód. ${c})`));
o.push('');if(L.o&&Object.keys(base).length)o.push('📝 Recado do rep.: '+L.o);if(obsC.trim())o.push('💬 Obs. do cliente: '+obsC.trim());
if(PRICE){o.push(`*Total (tabela + IPI): ${br(t.t)}*`);if(force)o.push('⚠ Abaixo do mínimo')}o.push('Enviado pelo catálogo Metalmig');return o.filter((x,i,a)=>!(x===''&&a[i-1]==='')).join('\n')}
function doSend(force){sent=msg(force);view='done';draw();window.scrollTo(0,0);location.href='https://wa.me/'+PH+'?text='+encodeURIComponent(sent)}
function vDone(){return`<div class=wrap><div class=card><h2>Pedido pronto! ✅</h2><p>O WhatsApp deve abrir com a mensagem pronta. É só tocar em <b>Enviar</b>.</p></div><a class="btn g" style="text-decoration:none" href="https://wa.me/${PH}?text=${encodeURIComponent(sent)}">📲 Abrir o WhatsApp de novo</a><div class="btn l" data-a="copy">📋 Copiar o pedido</div><div class="btn l" data-a="v" data-v="pedido">‹ Voltar ao pedido</div></div>`}
function draw(keep){const a=$('#app');const y=keep?window.scrollY:0;const ae=document.activeElement,sel=ae&&['sq','lq','hq'].includes(ae.id)?[ae.id,ae.selectionStart]:null;
 a.innerHTML=({hello:vHello,home:vHome,line:vLine,busca:vBusca,pedido:vPedido,min:vMin,pages:vPages,done:vDone})[view]();$('#tt').textContent=cli.n||'Metalmig';bar();nav();
 if(keep)window.scrollTo(0,y);if(sel){const i=$('#'+sel[0]);if(i){i.focus();i.setSelectionRange(sel[1],sel[1])}}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,c=t.dataset.c;
if(a==='a')setQ(c,1);else if(a==='s')setQ(c,-1);
else if(a==='v'){if(view==='pedido'){const o=$('#obs');if(o)obsC=o.value}if(t.dataset.v==='busca')sq='';view=t.dataset.v;draw();window.scrollTo(0,0)}
else if(a==='ok'){view='home';draw();window.scrollTo(0,0)}else if(a==='fix'){fixing=true;draw()}
else if(a==='save'){const n=$('#fn').value.trim(),cd=$('#fc').value.trim(),tt=$('#ft').value.trim();if(!n){alert('Informe o nome da empresa');return}if(L.n&&(n!==L.n||cd!==(L.cd||'')||tt!==(L.t||'')))corr=true;cli={n,cd,t:tt};fixing=false;view='home';draw();window.scrollTo(0,0)}
else if(a==='line'){ln=+t.dataset.i;sq='';view='line';draw();window.scrollTo(0,0)}
else if(a==='pages'){if(t.dataset.p)pg=+t.dataset.p;view='pages';draw();window.scrollTo(0,0)}
else if(a==='pg'){pg=Math.min(18,Math.max(1,pg+ +t.dataset.d));draw();window.scrollTo(0,0)}
else if(a==='send'){const o=$('#obs');if(o)obsC=o.value;const tt=total();if(!tt.n)return;if(chkMin()&&tt.t<MIN){minS=sugs().slice(0,5);view='min';draw();window.scrollTo(0,0)}else doSend(false)}
else if(a==='send2')doSend(false);else if(a==='force')doSend(true);
else if(a==='copy'){try{navigator.clipboard.writeText(sent);t.textContent='✔ Copiado'}catch(x){}}});
document.addEventListener('input',e=>{const id=e.target.id;
 if(id==='sq'){sq=e.target.value;$('#res').innerHTML=searchRes(sq)}
 else if(id==='lq'){sq=e.target.value;$('#lres').innerHTML=lineList()}
 else if(id==='hq'){const v=e.target.value;if(v.trim().length>=2){sq=v;view='busca';draw();const i=$('#sq');if(i){i.focus();i.setSelectionRange(v.length,v.length)}}}});
draw();
</script></body></html>
