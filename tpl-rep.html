<style>
:root{--navy:#1F4E78;--blue:#2F5597;--light:#D9E1F2;--lighter:#EEF3FA;--red:#C62828;--green:#2E7D32;--ink:#1c2733;--mute:#5b6773}
*{box-sizing:border-box}body{margin:0;font:14px/1.4 Arial,Helvetica,sans-serif;color:var(--ink);background:#f4f6fa}
header{background:var(--navy);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:14px}#hlogo{display:none;background:#fff;border-radius:8px;padding:5px 10px;height:44px;width:auto;box-sizing:border-box}#hlogo.on{display:block}#slogo{margin-left:auto;background:#fff;border-radius:8px;padding:3px 8px;height:48px;width:auto;box-sizing:border-box}header h1{margin:0;font-size:20px}header small{opacity:.9}
.bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:flex-end;padding:10px 20px;background:#fff;border-bottom:1px solid #d5dbe6;position:sticky;top:0;z-index:5}
.bar label{display:flex;flex-direction:column;font-size:11px;color:var(--mute);gap:2px}
select,input{font-size:14px;padding:6px 7px;max-width:100%}#sel{min-width:270px}
button{font-size:14px;padding:8px 14px;border:0;border-radius:6px;background:var(--blue);color:#fff;cursor:pointer}button.alt{background:#2E7D32}button.wa{background:#25D366;color:#073}
main{max-width:1100px;margin:0 auto;padding:14px 20px 40px}
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:8px 0}
@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}}
.card{background:#fff;border:1px solid #cfd8e6;border-radius:8px;padding:9px 11px;position:relative;min-width:0}.card b{display:block;font-size:10.5px;color:var(--navy);letter-spacing:.2px;padding-right:22px}
.card span{display:block;font-size:21px;font-weight:700;color:var(--navy);margin-top:2px}.card i{font-style:normal;font-size:12px;font-weight:700}.up{color:var(--green)}.dn{color:var(--red)}.card em{display:block;font-style:normal;font-size:11px;color:var(--mute)}
.dl{position:absolute;top:5px;right:5px;padding:1px 5px;font-size:12px;border-radius:4px;background:#e8eefb;color:var(--navy);border:1px solid #b9c7e2;line-height:1.3}
h2{background:var(--blue);color:#fff;font-size:13px;margin:18px 0 0;padding:6px 10px;border-radius:6px 6px 0 0;display:flex;justify-content:space-between;align-items:center}h2 .dl{position:static}
table{width:100%;border-collapse:collapse;background:#fff;font-size:12.5px}th{background:var(--navy);color:#fff;padding:6px;text-align:center}td{border:1px solid #d9dfe9;padding:5px 7px}td.n{text-align:right}td.c{text-align:center}
.act{background:var(--lighter);border:1px solid #cfd8e6;border-radius:0 0 8px 8px;padding:8px 14px}.act p{margin:5px 0}
.chart{background:#fff;border:1px solid #d9dfe9;padding:10px}svg text{font:10px Arial}
.inat{color:var(--red);font-weight:700}.mute{color:var(--mute);font-size:12px}
textarea{width:100%;height:330px;font:13px/1.35 Arial;padding:10px;border:1px solid #cfd8e6;border-radius:0 0 8px 8px}
.pg{break-inside:avoid}
body.mini header,body.mini .bar,body.mini main{display:none}#dlmsg{display:none;padding:40px 20px;font-size:16px;color:var(--navy);text-align:center}body.mini #dlmsg{display:block}
.lk{white-space:nowrap}.lk a{display:inline-block;text-decoration:none;font-size:15px;margin:0 2px;padding:0 3px;border-radius:4px;background:#eef3fa}.lk a.off{opacity:.35;pointer-events:none}.sm td{font-size:11.5px}
.ins p{margin:6px 0}.rs{max-width:1180px;margin:0 auto}.rs h3{margin:10px 0 4px;color:var(--navy);font-size:13px}.rs-leg{font-size:11.5px;color:#334;background:#f0f4fb;border:1px solid #d5dbe6;border-radius:8px;padding:6px 10px;margin:6px 0}.rs-s{font-size:12px;color:#667;margin:2px 2px 0}
.rs-b{background:#fff;border:1px solid #d5dbe6;border-top:0;padding:8px 14px;border-radius:0 0 6px 6px}.rs-b p{margin:7px 0;font-size:13.5px}.rs-n{font-size:11.5px;color:#667;padding:4px 2px}.rs-gt{background:#fff;color:#1F4E78;font-size:10px;padding:1px 7px;border-radius:10px;margin-left:8px}

const n3Crc=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=t[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}})();
function n3Zip(files){const enc=new TextEncoder(),parts=[],cen=[];let off=0;const u16=v=>[v&255,v>>8&255],u32=v=>[v&255,v>>8&255,v>>16&255,v>>24&255];

 const cs=cen.reduce((s,x)=>s+x.length,0);const end=new Uint8Array([0x50,0x4b,5,6,0,0,0,0,...u16(files.length),...u16(files.length),...u32(cs),...u32(off),0,0]);return new Blob([...parts,...cen,end],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})}

 const nm=sheets.map((s,i)=>x((s.n||'Planilha'+(i+1)).replace(/[\\\/?*\[\]:]/g,' ').slice(0,28)||'Planilha'+(i+1)));
 const F=[['[Content_Types].xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'+sheets.map((s,i)=>'<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join('')+'</Types>'],

 ['xl/workbook.xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'+nm.map((n,i)=>'<sheet name="'+n+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>').join('')+'</sheets></workbook>'],

 if(ina){if(!og)RV_OG.set(ci,[c[4],c[5],c[6]]);c[4]=-1;c[5]=0;c[6]=-1}
 else if(og){c[4]=og[0];c[5]=og[1];c[6]=og[2];RV_OG.delete(ci)}})}

// cadastros apontados em "outra razão social" (até 10) — compatível com o formato antigo (nc/nn)
const rvNl=m=>{if(!m)return[];if(Array.isArray(m.nl))return m.nl;if(m.nc)return[{c:String(m.nc),n:m.nn||''}];return[]};
const rvLivre=m=>Array.isArray(m.nl)?(m.nn||''):(m.nc?'':(m.nn||''));

const rvNomes=m=>{const a=rvNl(m).map(x=>x.n||(rvCodCli(x.c)||[])[1]||x.c);const l=rvLivre(m);if(l)a.push(l);return a.join('; ')};
function revFor(ri){const o={};D.cli.forEach(c=>{if(c[8]!==ri)return;const m=REV[String(c[0])];if(!m||m.s==='ativo')return;
 let nn='';if(m.s==='outra'){const a=rvNl(m).filter(x=>{const j=rvCodCli(x.c);return !(j&&j[8]!==ri)}).map(x=>x.n||(rvCodCli(x.c)||[])[1]||x.c);const l=rvLivre(m);if(l)a.push(l);nn=a.join('; ')}
 o[c[0]]={s:m.s,m:m.m||'',nn,v:m.v||'',d:m.d||''}});return o}
const rvDet=(m,gest)=>[m.s==='nao'&&m.m?'Motivo: '+m.m:'',m.s==='voltar'&&m.v?'Voltar a procurar em '+dstr(nxDayIso(m.v)):'',m.s==='outra'&&rvNomes(m)?'Compra em: '+rvNomes(m):'',gest&&m.t?m.t:''].filter(Boolean).join(' · ');
function rvBanner(ci){const m=REV[String(D.cli[ci][0])];if(!m||m.s==='ativo')return'';const ina=rvInativo(m);return `<div style="margin:8px 0;padding:8px 12px;background:${ina?'#fff3e0':'#eaf7ee'};border:1px solid ${ina?'#e0a85a':'#9ad3a8'};border-radius:8px">📋 <b>${n3Esc(RV_NM[m.s]||m.s)}</b>${m.d?' · marcado em '+dstr(nxDayIso(m.d)):''}${rvDet(m,!D.rm)?'<br><span style="font-size:13px">'+n3Esc(rvDet(m,!D.rm))+'</span>':''}${ina?'<br><span class="mute" style="font-size:12px">Fora dos alertas e das listas de ligar. As vendas passadas continuam nos números.</span>':''}</div>`}
{const _nb4=nxvBox;nxvBox=function(ci){return rvBanner(ci)+_nb4(ci)}}
// ---------- histórico de compras (todas as épocas) ----------
let RVH=null;
function rvHistAll(){if(RVH)return RVH;const M=new Map();for(let i=0;i<N;i++){let m=M.get(L.C[i]);if(!m)M.set(L.C[i],m=new Map());let x=m.get(L.O[i]);if(!x)m.set(L.O[i],x={d:L.D[i],v:0,r:L.R[i]});x.v+=L.V[i]}
 M.forEach((m,k)=>M.set(k,[...m.values()].sort((a,b)=>b.d-a.d)));RVH=M;return M}
const rvHist=ci=>rvHistAll().get(ci)||[];
const rvUlt=ci=>{const h=rvHist(ci);return h.length?h[0].d:-1};
const rvMeses=ci=>{const u=rvUlt(ci);return u<0?999:(D.ref-u)/30.4375};
function rvHa(d){const dias=D.ref-d,mm=Math.floor(dias/30.4375),y=Math.floor(mm/12),m=mm%12;if(dias<30)return dias<=0?'hoje':'há '+dias+' dia'+(dias>1?'s':'');return 'há '+[y?y+(y>1?' anos':' ano'):'',m?m+(m>1?' meses':' mês'):''].filter(Boolean).join(' e ')}
function rvReps(ci){const c=D.cli[ci],ord=[c[8]];rvHist(ci).forEach(h=>{if(ord.indexOf(h.r)<0)ord.push(h.r)});return ord.map(r=>sqRn(r)).filter((v,i,z)=>v&&z.indexOf(v)===i)}
// ---------- cadastros parecidos (mesma empresa com outra razão social) ----------
const RV_GEN=new Set('ltda,eireli,epp,para,materiais,material,construcao,construcoes,comercio,comercial,deposito,casa,casas,loja,ferragens,ferragem,telhas,telha,madeiras,madeireira,distribuidora,distrib,construtora,atacado,varejo,servicos,industria,representacoes,empreendimentos,construc'.split(','));
const rvTok=s=>fNorm(s).split(/[^a-z0-9]+/).filter(w=>w.length>=4&&!RV_GEN.has(w));
let RVTK=null,RVNM=null;
function rvSim(ci){if(!RVTK){RVTK=new Map();RVNM=new Map();D.cli.forEach((c,j)=>{const k=fNorm(c[1]).trim();RVNM.set(k,(RVNM.get(k)||0)+1);new Set(rvTok(c[1])).forEach(t=>{let a=RVTK.get(t);if(!a)RVTK.set(t,a=[]);a.push(j)})})}
 const c=D.cli[ci],sc=new Map();new Set(rvTok(c[1])).forEach(t=>(RVTK.get(t)||[]).forEach(j=>{if(j!==ci&&D.cli[j][2]===c[2]){let a=sc.get(j);if(!a)sc.set(j,a=[]);a.push(t)}}));
 const lm=rvUlt(ci),out=[];sc.forEach((tk,j)=>{if(!(tk.length>=2||tk[0].length>=7))return;const u=rvUlt(j);if(u<0||u<=lm||D.ref-u>365)return;out.push({j,d:u})});
 return out.sort((a,b)=>b.d-a.d).slice(0,3)}

// ---------- resumo e gráficos ----------
function rvSumList(lst){const cnt={},mot={};let tot=0;lst.forEach(ci=>{const m=REV[String(D.cli[ci][0])];if(!m)return;tot++;cnt[m.s]=(cnt[m.s]||0)+1;if(m.s==='nao'&&m.m)mot[m.m]=(mot[m.m]||0)+1});return{tot,cnt,mot}}
function rvDonut(cnt,tot){if(!tot)return'';const ks=RV_ST.map(x=>x[0]).filter(k=>cnt[k]);let cum=0,seg='';ks.forEach(k=>{const p=cnt[k]/tot*100;seg+=`<circle cx="21" cy="21" r="15.9155" fill="none" stroke="${RV_COR[k]}" stroke-width="7" stroke-dasharray="${p.toFixed(3)} ${(100-p).toFixed(3)}" stroke-dashoffset="${(25-cum).toFixed(3)}"/>`;cum+=p});
 return `<div style="display:flex;gap:14px;flex-wrap:wrap;align-items:center"><svg viewBox="0 0 42 42" width="150" height="150" role="img" aria-label="Situação dos clientes revisados"><circle cx="21" cy="21" r="15.9155" fill="none" stroke="#eef1f6" stroke-width="7"/>${seg}<text x="21" y="21.5" text-anchor="middle" font-size="7" font-weight="700" fill="#1F4E78">${tot}</text><text x="21" y="27" text-anchor="middle" font-size="3" fill="#666">revisados</text></svg><div style="font-size:14px">${ks.map(k=>`<div style="margin:3px 0"><span style="display:inline-block;width:12px;height:12px;background:${RV_COR[k]};border-radius:3px;vertical-align:-1px"></span> ${RV_NM[k].replace('…','')} <b>${cnt[k]}</b> <span style="color:#777">(${Math.round(cnt[k]/tot*100)}%)</span></div>`).join('')}</div></div>`}
function rvBars(mot){const ks=Object.keys(mot).sort((a,b)=>mot[b]-mot[a]);if(!ks.length)return'';const mx=mot[ks[0]];return `<div style="margin-top:10px"><b style="font-size:14px">Motivos de "Não quer comprar"</b>${ks.map(k=>`<div style="display:flex;align-items:center;gap:8px;margin-top:4px"><span style="width:120px;font-size:13px">${n3Esc(k)}</span><span style="flex:1;background:#eef1f6;border-radius:4px;height:12px"><span style="display:block;height:12px;border-radius:4px;background:${RV_COR.nao};width:${Math.round(mot[k]/mx*100)}%"></span></span><b style="width:26px;text-align:right">${mot[k]}</b></div>`).join('')}</div>`}
function rvCards(cnt,sc){const c=(t,k)=>`<div${sc?` class="rvk" data-k="${k}" data-sc="${sc}" role="button" title="Ver os clientes"`:''} style="flex:1;min-width:110px;border:1px solid #d9dfe9;border-left:5px solid ${RV_COR[k]};border-radius:8px;padding:8px 10px;background:#fff${sc?';cursor:pointer':''}"><div style="font-size:24px;font-weight:800;color:${RV_COR[k]}">${cnt[k]||0}</div><div style="font-size:13px">${t}</div>${sc?'<div style="font-size:11.5px;color:#1F4E78;margin-top:2px">ver clientes ›</div>':''}</div>`;
 const ex=sc?[['ramo','Mudaram de ramo'],['regiao','Fora da região'],['conheco','Não conheço'],['voltar','Voltar a procurar']].filter(x=>cnt[x[0]]).map(x=>c(x[1],x[0])).join(''):'';
 return `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">${c('Ativos','ativo')}${c('Fecharam','fechou')}${c('Outra razão social','outra')}${c('Não querem comprar','nao')}${ex}</div>`}
const rvPanel=(lst,tit,sc)=>{const s=rvSumList(lst);return s.tot?`<div style="margin-top:6px"><b style="color:#1F4E78">${n3Esc(tit)}</b>${rvCards(s.cnt,sc)}${rvDonut(s.cnt,s.tot)}${rvBars(s.mot)}</div>`:`<div class="mute" style="margin-top:6px">${n3Esc(tit)}: ainda não há clientes marcados.</div>`};
// resumo por período (relatório da viagem): todas as marcações feitas entre duas datas
function rvPeriodo(ini,fim){const cod=new Map();D.cli.forEach((c,i)=>cod.set(String(c[0]),i));const cnt={},mot={},porRep={};let tot=0;
 for(const k in REV){const m=REV[k];if(!m||!m.d||m.d<ini||m.d>fim)continue;const ci=cod.get(k);if(ci==null)continue;tot++;cnt[m.s]=(cnt[m.s]||0)+1;if(m.s==='nao'&&m.m)mot[m.m]=(mot[m.m]||0)+1;const rn=sqRn(D.cli[ci][8])||'—';(porRep[rn]=porRep[rn]||{})[m.s]=(porRep[rn][m.s]||0)+1}
 return{tot,cnt,mot,porRep}}

function rvTripTxt(v){if(D.rm)return'';const[a,b]=rvTripRange(v),s=rvPeriodo(a,b);if(!s.tot)return'';let t='*Revisão de carteira nesta viagem* ('+s.tot+' clientes revisados)\n';RV_ST.forEach(([k,n])=>{if(s.cnt[k])t+=n.replace('…','')+': '+s.cnt[k]+'\n'});const ms=Object.keys(s.mot);if(ms.length)t+='Motivos (não quer comprar): '+ms.map(k=>k+' '+s.mot[k]).join(', ')+'\n';const rp=Object.keys(s.porRep);if(rp.length>1)t+='Por representante: '+rp.map(r=>r+' '+Object.values(s.porRep[r]).reduce((x,y)=>x+y,0)).join(' · ')+'\n';return t}
function rvTripHtml(v){if(D.rm)return'';const[a,b]=rvTripRange(v),s=rvPeriodo(a,b);if(!s.tot)return'';const rp=Object.keys(s.porRep).sort();
 return `<h3>Revisão de carteira nesta viagem (${s.tot} clientes)</h3>${rvCards(s.cnt)}${rvDonut(s.cnt,s.tot)}${rvBars(s.mot)}<table><tr><th>Representante</th><th class=r>Revisados</th>${RV_ST.filter(x=>x[0]!=='voltar'||s.cnt.voltar).map(x=>'<th class=r>'+x[1].replace(/^\S+\s/,'').replace('…','')+'</th>').join('')}</tr>${rp.map(r=>{const o=s.porRep[r];return '<tr><td>'+n3Esc(r)+'</td><td class=r>'+Object.values(o).reduce((x,y)=>x+y,0)+'</td>'+RV_ST.filter(x=>x[0]!=='voltar'||s.cnt.voltar).map(x=>'<td class=r>'+(o[x[0]]||'')+'</td>').join('')+'</tr>'}).join('')}</table>`}
