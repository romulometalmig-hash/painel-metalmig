<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>Dashboard Metalmig</title>
<style>*{box-sizing:border-box;margin:0}body{background:#f4f6fa;padding:12px 12px 40px;font-family:system-ui,Roboto,Arial,sans-serif;color:#14233f}.msg{max-width:560px;margin:40px auto;background:#fff;border:1px solid #d5dbe6;border-radius:14px;padding:18px;font-size:16px;text-align:center}.ft{max-width:560px;margin:16px auto 0;font-size:12px;color:#4a566b;text-align:center}.dsh{font-family:system-ui,Roboto,Arial,sans-serif;color:#14233f;max-width:560px;margin:0 auto}.dsh *{box-sizing:border-box}
.dsh .hd{background:#1F4E78;color:#fff;padding:14px 16px;border-radius:14px}.dsh .hd small{opacity:.85;font-size:12.5px}.dsh .hd b{display:block;font-size:21px;margin-top:2px}
.dsh h3{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:#4a566b;margin:16px 0 6px}
.dsh .k{display:grid;grid-template-columns:1fr 1fr;gap:8px}.dsh .c{background:#fff;border:1px solid #d5dbe6;border-radius:14px;padding:11px}.dsh .c small{font-size:11px;color:#4a566b;font-weight:700;text-transform:uppercase}.dsh .c b{display:block;font-size:21px;margin:3px 0}.dsh .c i{font-style:normal;font-size:12.5px;font-weight:700}
.dsh .dn{color:#b42318}.dsh .up{color:#17803f}
.dsh .al{background:#fff4e5;border:1px solid #f0b99a;border-radius:14px;padding:11px 13px;font-size:14px;margin:10px 0 0}.dsh .al b{font-size:15.5px}
.dsh .row{background:#fff;border:1px solid #d5dbe6;border-radius:12px;padding:12px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;font-size:14.5px;cursor:pointer}.dsh .row b{font-size:16px}.dsh .row.z{opacity:.55;cursor:default}
.dsh .tp{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:6px 0;border-bottom:1px dashed #d5dbe6}.dsh .tp:last-child{border:0}.dsh .c .tp b{font-size:13.5px;display:inline;margin:0}.dsh .tp b{text-align:right}
.dsh .cl{background:#fff;border:1px solid #d5dbe6;border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:14px}.dsh .cl b{display:block;font-size:15px}.dsh .cl small{color:#4a566b;font-size:12.5px;display:block;margin-top:2px}
.dsh .a{display:flex;gap:8px;margin-top:9px}.dsh .a a,.dsh .a span{flex:1;text-align:center;border-radius:10px;padding:11px 4px;font-weight:800;font-size:13.5px;background:#17803f;color:#fff;text-decoration:none;cursor:pointer}.dsh .a .o{background:#d9480f}
.dsh .bk{display:inline-block;font-weight:800;color:#14233f;background:#fff;border:2px solid #aab4c6;border-radius:12px;padding:10px 14px;margin:10px 0;cursor:pointer}.dsh p.n{font-size:13px;color:#4a566b;margin:6px 0 10px}</style></head><body><div id="app"><div class="msg">Carregando…</div></div><div class="ft">Metalmig · dados de uma fotografia do dia em que o link foi gerado.</div>
<script>
// ===== Dashboard do representante/gestor: renderizador compartilhado (painel + d.html) =====
const DASH=(function(){
 const E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 const money=v=>v>=1e6?'R$ '+(v/1e6).toFixed(2).replace('.',',')+' mi':v>=1e4?'R$ '+Math.round(v/1e3)+' mil':'R$ '+Math.round(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.');
 const pct=(a,b)=>b>0?Math.round((a/b-1)*100):null;
 const dl=(p,suf,a,b)=>p==null?`<i style="color:#4a566b">${a||b?'sem base de comparação':'sem pedidos no período'}</i>`:`<i class="${p<0?'dn':'up'}">${p<0?'▼':'▲'} ${Math.abs(p)}% ${suf}</i>`;
 const CSS=`.dsh{font-family:system-ui,Roboto,Arial,sans-serif;color:#14233f;max-width:560px;margin:0 auto}.dsh *{box-sizing:border-box}
.dsh .hd{background:#1F4E78;color:#fff;padding:14px 16px;border-radius:14px}.dsh .hd small{opacity:.85;font-size:15px}.dsh .hd b{display:block;font-size:25.2px;margin-top:2px}
.dsh h3{font-size:15.6px;letter-spacing:.04em;text-transform:uppercase;color:#4a566b;margin:16px 0 6px}
.dsh .k{display:grid;grid-template-columns:1fr 1fr;gap:8px}.dsh .c{background:#fff;border:1px solid #d5dbe6;border-radius:14px;padding:11px}.dsh .c small{font-size:13.2px;color:#4a566b;font-weight:700;text-transform:uppercase}.dsh .c b{display:block;font-size:25.2px;margin:3px 0}.dsh .c i{font-style:normal;font-size:15px;font-weight:700}
.dsh .dn{color:#b42318}.dsh .up{color:#17803f}
.dsh .al{background:#fff4e5;border:1px solid #f0b99a;border-radius:14px;padding:11px 13px;font-size:16.8px;margin:10px 0 0}.dsh .al b{font-size:18.6px}
.dsh .row{background:#fff;border:1px solid #d5dbe6;border-radius:12px;padding:12px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;font-size:17.4px;cursor:pointer}.dsh .row b{font-size:19.2px}.dsh .row.z{opacity:.55;cursor:default}
.dsh .tp{display:flex;justify-content:space-between;gap:10px;font-size:16.2px;padding:6px 0;border-bottom:1px dashed #d5dbe6}.dsh .tp:last-child{border:0}.dsh .c .tp b{font-size:16.2px;display:inline;margin:0}.dsh .tp b{text-align:right}
.dsh .cl{background:#fff;border:1px solid #d5dbe6;border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:16.8px}.dsh .cl b{display:block;font-size:18px}.dsh .cl small{color:#4a566b;font-size:15px;display:block;margin-top:2px}
.dsh .a{display:flex;gap:8px;margin-top:9px}.dsh .a a,.dsh .a span{flex:1;text-align:center;border-radius:10px;padding:11px 4px;font-weight:800;font-size:16.2px;background:#17803f;color:#fff;text-decoration:none;cursor:pointer}.dsh .a .o{background:#d9480f}
.dsh .bk{display:inline-block;font-weight:800;color:#14233f;background:#fff;border:2px solid #aab4c6;border-radius:12px;padding:10px 14px;margin:10px 0;cursor:pointer}.dsh p.n{font-size:15.6px;color:#4a566b;margin:6px 0 10px}
.dsh .dn2{display:flex;align-items:center;gap:14px}.dsh .dn2 svg{flex:0 0 auto;width:120px;height:120px}.dsh .lg{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}.dsh .lg div{display:flex;align-items:flex-start;gap:8px;font-size:16px;line-height:1.2}.dsh .lg i{flex:0 0 auto;width:14px;height:14px;border-radius:4px}.dsh .lg span{flex:1;min-width:0;overflow-wrap:anywhere;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.dsh .lg b{flex:0 0 auto;font-size:16px}.dsh .gt{font-size:15.5px;font-weight:800;margin:0 0 8px;color:#14233f}.dsh .c.g{margin-top:8px;padding:14px}.dsh .hd{padding:10px 14px}.dsh .hd b{font-size:24px}.dsh .al{padding:8px}.dsh .c{padding:8px 6px}.dsh .c b{font-size:26px}.dsh h3{margin:10px 2px 6px}.dsh .row{padding:10px 12px}.dsh .pb{height:14px;border-radius:8px;background:#e3e8f0;overflow:hidden;margin:8px 0 4px;width:100%}.dsh .pb u{display:block;height:100%;background:#17803f}.dsh .t3{display:flex;justify-content:space-between;gap:10px;font-size:16px;padding:6px 0;border-bottom:1px dashed #d5dbe6;text-align:left}.dsh .t3:last-child{border:0}.dsh .t3 b{display:inline;font-size:16px;margin:0;white-space:nowrap}.dsh .fm{display:flex;flex-direction:column;gap:8px;margin:8px 0}.dsh .fm input{font-size:18px;padding:12px;border:2px solid #aab4c6;border-radius:10px;width:100%}.dsh .fm .a span{background:#17803f}.dsh .x{color:#b42318;font-weight:800;cursor:pointer;padding:8px}.dsh .c.tap{cursor:pointer}
.dsh .hd,.dsh h3,.dsh .c,.dsh .al,.dsh p.n,.dsh .cl{text-align:center}.dsh .hd b{font-size:28px}.dsh .k .c{display:flex;flex-direction:column;align-items:center;justify-content:center}
.dsh .row{flex-direction:column;justify-content:center;gap:4px;text-align:center;padding:14px}.dsh .tp{flex-direction:column;align-items:center;text-align:center;gap:2px}.dsh .tp b{text-align:center}
.dsh .lg b small{display:block;font-size:12px;font-weight:600;color:#4a566b;text-align:right}.dsh .dn2{flex-direction:column;gap:12px}.dsh .dn2 svg{width:170px;height:170px}.dsh .lg{width:100%}.dsh .lg div{justify-content:center;gap:10px}.dsh .lg span{flex:0 1 auto;text-align:left}.dsh .a{justify-content:center}`;
 const LBL={queda:['📉','Pedidos menores que o normal','Compraram, mas o valor dos pedidos caiu.'],rec:['🛒','Hora de recomprar','Clientes no ritmo de compra deles, ou já passaram dele.'],reat:['🔄','Clientes para reativar','Pararam de comprar. Do que mais chance até o que menos.'],orc:['🧾','Orçamentos em aberto','Orçamentos que você registrou e ainda não fecharam.'],rea:['🔁','Clientes reativados no mês','Voltaram a comprar neste mês depois de mais de 6 meses sem pedido.'],perd:['⛔','Clientes que pararam de comprar','Passaram de 6 meses sem pedido durante este mês.']};
 const PAL=['#1F4E78','#d9480f','#17803f','#7a3fb0','#c28a00','#8a94a8'];
 function donut(t,data,ctr,sub){const tot=data.reduce((a,x)=>a+x[1],0);if(!(tot>0))return'';const R=46,C=2*Math.PI*R;let off=0;const arcs=data.map((x,i)=>{const f=x[1]/tot,len=f*C,a=`<circle cx="60" cy="60" r="${R}" fill="none" stroke="${PAL[i%PAL.length]}" stroke-width="22" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 60 60)"/>`;off+=len;return a}).join('');let o2=0;const lab=data.map((x,i)=>{const f=x[1]/tot,mid=(o2+f*C/2)/C*2*Math.PI-Math.PI/2;o2+=f*C;if(f<0.05)return'';const tx=x[2]!=null?E(x[2]):Math.round(100*f)+'%';return `<text x="${(60+R*Math.cos(mid)).toFixed(1)}" y="${(60+R*Math.sin(mid)).toFixed(1)}" text-anchor="middle" dominant-baseline="central" style="font-size:13px;font-weight:900" fill="#fff" stroke="rgba(0,0,0,.5)" stroke-width="1" paint-order="stroke">${tx}</text>`}).join('');const cs=ctr==null?money(tot):ctr,cf=ctr==null?(String(cs).length>8?15:18):26,sb=ctr==null?'vendido':sub;
  const lg=data.map((x,i)=>`<div><i style="background:${PAL[i%PAL.length]}"></i><span>${E(x[0])}</span><b>${x[2]!=null?E(x[2]):Math.round(100*x[1]/tot)+'%'}${x[2]==null?`<small>${money(x[1])}</small>`:''}</b></div>`).join('');
  return `<div class="c g"><div class="gt">${E(t)}</div><div class="dn2"><svg viewBox="0 0 120 120" role="img" aria-label="${E(t)}">${arcs}${lab}<text x="60" y="${sb?57:66}" text-anchor="middle" font-size="${cf}" font-weight="800" fill="#14233f">${E(cs)}</text>${sb?`<text x="60" y="75" text-anchor="middle" font-size="10.5" font-weight="700" fill="#4a566b">${E(sb)}</text>`:''}</svg><div class="lg">${lg}</div></div></div>`}
 function graficos(d,g){const K=d.k||{},G=d.G||{};let h='';
  if(K.cart>0){const nc=Math.max(0,K.cart-(K.cc||0));h+=donut('Carteira ativa: quem comprou no mês',[['Compraram',K.cc||0,String(K.cc||0)],['Ainda não compraram',nc,String(nc)]],Math.round(100*(K.cc||0)/K.cart)+'%','compraram')}
  if(G.p&&G.p.length)h+=donut('Vendido por produto',G.p.map(x=>[x[0],x[1]]));
  if(G.c&&G.c.length)h+=donut('Vendido por cidade',G.c.map(x=>[x[0],x[1]]));
  if(g&&G.l&&G.l.length)h+=donut('Vendido por linha de produto',G.l.map(x=>[x[0],x[1]]));if(g&&G.u&&G.u.length)h+=donut('Vendido por estado',G.u.map(x=>[x[0],x[1]]));if(g&&G.r&&G.r.length)h+=donut('Vendido por representante',G.r.map(x=>[x[0],x[1]]));
  return h?`<h3>Gráficos do mês</h3>${h}`:''}
 function projC(d){const K=d.k||{},f=d.proj.f||0,v=K.vend||0;if(!(f>0))return '';const p=Math.min(100,Math.round(100*v/f)),ok=v>=f;return `<div class="c" style="margin-top:8px"><small>Meta: igualar ${E(d.mp)} inteiro</small><b>${ok?'✔ Já passou!':'Faltam '+money(f-v)}</b><div class="pb"><u style="width:${p}%"></u></div><i style="color:#4a566b">${E(d.mp)} fechou em ${money(f)} · você está em ${p}%</i></div>`}
 function mini(d,k){const L=(d.L||{})[k]||[];return L.length}
 function view(d,st){const g=!!d.g;st=st||{};
  if(st.l==='rk'||st.l==='sem'){const sem=st.l==='sem';let R=(d.RK||[]).slice();if(sem)R=R.filter(x=>!x.v).sort((a,b)=>a.ud-b.ud);const ttl=sem?'Representantes sem pedido no mês':'Representantes: este mês × mês anterior';
   return `<div class="dsh"><div class="hd"><small>‹ Voltar ao dashboard</small><b>${ttl} · ${R.length}</b></div><div class="bk" data-back>‹ Voltar</div><p class="n">${sem?'Do que está há mais tempo sem pedido para o mais recente.':'🟢 vendeu igual ou mais que o mês passado · 🔴 vendeu menos · ⚪ sem pedido no mês.'}</p>${R.map(x=>{const p=pct(x.v,x.vP),f=!x.v?'⚪':(p!=null&&p<0)?'🔴':'🟢';return `<div class="cl"><b>${f} ${E(x.n)}</b><small>Vendido no mês: ${money(x.v)}${p!=null&&x.v?' · '+(p<0?'▼ ':'▲ ')+Math.abs(p)+'% vs. '+E(d.mp):''}</small><small>${E(d.mp)} (mesmo período): ${money(x.vP)}</small><small>Último pedido: ${E(x.u||'—')} · ${x.q} clientes ativos</small></div>`}).join('')||'<p class="n">Nenhum representante nesta lista.</p>'}</div>`}
  if(st.l==='rvl'){const V=d.rv||{L:[]};return `<div class="dsh"><div class="hd"><small>‹ Voltar ao dashboard</small><b>Representantes novos</b></div><div class="bk" data-back>‹ Voltar</div><p class="n">Registre quando um representante entra, mesmo que ele ainda não tenha pedido.</p><div class="fm"><input id="rv_n" list="rv_l" placeholder="Nome do representante"><datalist id="rv_l">${(d.RN||[]).map(n=>`<option value="${E(n)}">`).join('')}</datalist><input id="rv_d" type="date"><div class="a"><span data-rvadd>➕ Registrar</span></div></div>${(V.L||[]).map(x=>`<div class="cl"><b>${E(x.n)}</b><small>Entrou em ${E(x.d)} · ${x.t==='reg'?'registrado por você':'1º pedido no mês'}</small>${x.t==='reg'?`<small>${x.q} cliente(s) · ${x.p} pedido(s) no mês</small><span class="x" data-rvdel="${x.i}">🗑 Remover registro</span>`:''}</div>`).join('')||'<p class="n">Nenhum representante novo registrado.</p>'}</div>`}
  if(st.l){const k=st.l,L=(d.L||{})[k]||[],m=LBL[k];return `<div class="dsh"><div class="hd"><small>‹ Voltar ao dashboard</small><b>${m[1]} · ${d.N&&d.N[k]!=null?d.N[k]:L.length}</b></div><div class="bk" data-back>‹ Voltar</div><p class="n">${m[2]}</p>${L.map((x,i)=>`<div class="cl"><b>${E(x.n)}</b><small>${E(x.c)}${x.x?' · '+E(x.x):''}${g&&x.r?' · Rep.: '+E(x.r):''}</small>${x.d?`<small>Último pedido: ${E(x.d)}${x.v?' · '+E(money(x.v))+' em 12 meses':''}</small>`:''}<div class="a">${x.t?`<a href="tel:${E(String(x.t).replace(/\D/g,''))}">📞 Ligar</a>`:''}${g&&x.ci!=null?`<span class="o" data-ficha="${x.ci}">👤 Ver ficha</span><span class="o" data-cat="${x.ci}">📖 Catálogo</span>`:(d.cb?`<a class="o" href="${E(d.cb(x))}">📖 Enviar catálogo</a>`:'')}</div></div>`).join('')||'<p class="n">Nenhum cliente nesta lista.</p>'}${d.N&&d.N[k]>L.length?`<p class="n">Mostrando os ${L.length} primeiros de ${d.N[k]}.</p>`:''}</div>`}
  const K=d.k||{},nv=d.nv||{},U=d.ult,D=d.dest||{};
  const rows=['queda','rec','reat','rea'].concat(g?['perd','orc']:[]).map(k=>{const n=d.N&&d.N[k]!=null?d.N[k]:mini(d,k);return `<div class="row${n?'':' z'}" ${n?`data-l="${k}"`:''}><span>${LBL[k][0]} ${LBL[k][1]}</span><span><b>${n}</b>${n?' <span style="color:#9aa6bb">›</span>':''}</span></div>`}).join('');
  const al=(d.N&&(d.N.queda||d.N.rec))?`<div class="al"><b>${d.N.rec||0} clientes na hora de recomprar</b><br>${d.N.queda||0} com pedidos menores que o normal</div>`:'';
  return `<div class="dsh"><div class="hd"><small>${E(d.mes)} · dados até ${E(d.ate)}</small><b>${E(d.titulo)}</b></div>${al}
<h3>Vendas do mês · vs. mês anterior</h3><div class="k"><div class="c"><small>Vendido</small><b>${money(K.vend||0)}</b>${dl(pct(K.vend,K.vendP),'vs. '+d.mp,K.vend,K.vendP)}</div><div class="c"><small>Pedidos</small><b>${K.ped||0}</b>${dl(pct(K.ped,K.pedP),'vs. '+d.mp,K.ped,K.pedP)}</div><div class="c"><small>Ticket médio</small><b>${money(K.ped?K.vend/K.ped:0)}</b>${dl(pct(K.ped?K.vend/K.ped:0,K.pedP?K.vendP/K.pedP:0),'vs. '+d.mp,K.ped,K.pedP)}</div><div class="c"><small>Clientes que compraram</small><b>${K.cc||0}</b><i class="up">${K.cart?Math.round(100*K.cc/K.cart)+'% da carteira ativa':''}</i></div></div>
<p class="n" style="margin:4px 2px 0">Comparação: ${E(d.cmp)}</p>
${U?`<div class="c" style="margin-top:8px"><small>Último pedido realizado</small><b style="font-size:21px">${E(U.d)}</b>${U.v!=null?`<b style="font-size:21px;color:#1F4E78">${money(U.v)}</b>`:''}<i style="color:#4a566b">${E(U.n)} · ${E(U.c)}</i></div>`:''}
${d.proj?projC(d):''}${d.mx?`<div class="c" style="margin-top:8px"><small>Maior pedido do mês</small><b style="font-size:21px">${money(d.mx.v)}</b><i style="color:#4a566b">${E(d.mx.d)} · ${E(d.mx.n)} · ${E(d.mx.c)}</i></div>`:''}${d.t3&&d.t3.length?`<h3>Top clientes do mês</h3><div class="c">${d.t3.map((x,i)=>`<div class="t3"><span>${i+1}º ${E(x.n)}<br><small style="font-size:13px;color:#4a566b;font-weight:400;text-transform:none">${E(x.c)}</small></span><b>${money(x.v)}</b></div>`).join('')}</div>`:''}${graficos(d,g)}<h3>Clientes novos</h3><div class="k"><div class="c"><small>Novos no mês</small><b>${nv.q||0}</b>${nv.qP!=null?`<i style="color:#4a566b">${nv.qP} no mesmo período de ${E(d.mp)}</i>`:''}</div><div class="c"><small>Último cliente novo</small>${nv.d?`<b style="font-size:21px">${E(nv.d)}</b><i style="color:#4a566b">${E(nv.n)}<br>${nv.b?E(nv.b)+' · ':''}${E(nv.c)}</i>`:'<b>—</b>'}</div>${nv.y!=null?`<div class="c" style="grid-column:1/3"><small>Clientes abertos no ano</small><b>${nv.y}</b><i style="color:#4a566b">${nv.yP||0} no mesmo período de ${(parseInt(String(d.mes).slice(-4))||0)-1}</i></div>`:''}</div>
