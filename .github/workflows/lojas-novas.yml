name: Lojas novas (Receita Federal)
on:
  schedule:
    - cron: '0 6 12,25 * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/lojas-novas.yml'
      - 'ferramentas/lojas_novas.py'
permissions:
  contents: write
jobs:
  gera:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gera a lista
        run: python ferramentas/lojas_novas.py
      - name: Mostra o resultado
        if: always()
        run: |
          ls -la *.json || true
          cat lojas_novas_status.json || true
      - name: Guarda o resultado no repositório
        if: always()
        run: |
          git config user.name "Metalmig automático"
          git config user.email "noreply@github.com"
          for f in lojas_novas.json lojas_novas_ba.json cnpjs_fechados.json lojas_novas_status.json; do [ -f "$f" ] && git add -f "$f"; done; true
          git diff --cached --quiet || git commit -m "Lista de lojas novas atualizada"
          git pull --rebase origin main || true
          git push origin HEAD:main
